# Cloud Build job: download the four model folders from Hugging Face and copy them
# into gs://<bucket>/models/. Runs inside Google's network, so the 14 GB never
# touches your own connection.
#
#   gcloud builds submit --no-source --config deploy/gcp/seed-models.yaml \
#     --substitutions _BUCKET=<your-bucket>
#
# In this file $$ is a literal $ for bash; ${_BUCKET} is a Cloud Build substitution.

steps:
  - id: download
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install -q -U "huggingface_hub[cli]"
        for repo in \
            Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign \
            Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice \
            Qwen/Qwen3-TTS-12Hz-1.7B-Base \
            openai/whisper-large-v3-turbo; do
          hf download "$$repo" --local-dir "/workspace/models/$${repo#*/}"
        done
        rm -rf /workspace/models/*/.cache
        du -sh /workspace/models/*

  - id: upload
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["storage", "cp", "-r", "/workspace/models", "gs://${_BUCKET}/"]

options:
  diskSizeGb: 100
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
