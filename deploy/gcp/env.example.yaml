# Copy to env.yaml, edit, and pass with --env-vars-file. A YAML file is used
# because the comma in QWEN_TTS_CORS_ORIGINS breaks gcloud's --set-env-vars.
#
# QWEN_TTS_API_KEY is NOT set here. It comes from Secret Manager (--set-secrets).
# QWEN_TTS_MODEL_DIR / QWEN_TTS_VOICE_DIR are already set in the Dockerfile.

QWEN_TTS_CORS_ORIGINS: "https://yoursite.com,https://www.yoursite.com"

# Leave warmup OFF on Cloud Run. With it on, the container reads all 14 GB from
# Cloud Storage before it opens its port, which can exceed Cloud Run's startup
# deadline. Off, each model loads on its first request instead.
QWEN_TTS_WARMUP: "0"

# Stay under the Cloud Run request timeout (--timeout 900 in DEPLOY_GCP.md).
QWEN_TTS_TIMEOUT: "600"
